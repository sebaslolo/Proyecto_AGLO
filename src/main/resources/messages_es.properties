nosotros.subtitulo=SOBRE NOSOTROS
nosotros.titulo=Conservación, comunidad y turismo responsable
nosotros.descripcion=Se crea en 2006 para mantener bajo control la actividad turística durante el fenómeno de arribada, logrando reducir el impacto negativo del turismo sobre las especies que anidan en el Refugio. La Asociación de Guías Locales de Ostional (AGLO) es una organización comunitaria en Ostional, Costa Rica, enfocada en gestionar y controlar el turismo para mitigar su impacto negativo en la vida silvestre local, particularmente en las tortugas lora. Ofrecen visitas guiadas para educar a los visitantes sobre el fenómeno de anidación de las tortugas y los esfuerzos de conservación vigentes. AGLO también contribuye a diversas actividades comunitarias y atiende las necesidades de quienes solicitan su asistencia. Su misión es mantener el control sobre las actividades turísticas durante la arribada (temporada de anidación de tortugas), con el objetivo de reducir el impacto negativo del turismo en las especies que anidan en el Refugio Nacional de Vida Silvestre Ostional.

