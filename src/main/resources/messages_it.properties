inicio.bienvenida=Benvenuto in AGLO
inicio.descripcion=Lavoriamo per la conservazione delle tartarughe marine e la gestione responsabile del turismo a Ostional, Costa Rica.
inicio.verVideo=Guarda il video

# Sezione Chi Siamo
nosotros.subtitulo=CHI SIAMO
nosotros.titulo=Conservazione, comunit\u00e0 e turismo responsabile
nosotros.descripcion=Fondata nel 2006 per tenere sotto controllo l'attivit\u00e0 turistica durante il fenomeno dell'"arribada", riuscendo a ridurre l'impatto negativo del turismo sulle specie che nidificano nel Rifugio. L'Associazione delle Guide Locali di Ostional (AGLO) \u00e8 un'organizzazione comunitaria a Ostional, Costa Rica, incentrata sulla gestione e sul controllo del turismo per mitigare il suo impatto negativo sulla fauna selvatica locale, in particolare sulle tartarughe olivacee. Offrono visite guidate per educare i visitatori sul fenomeno di nidificazione delle tartarughe e sugli sforzi di conservazione in corso. AGLO contribuisce anche a varie attivit\u00e0 comunitarie e risponde alle esigenze di chi richiede assistenza. La sua missione \u00e8 mantenere il controllo sulle attivit\u00e0 turistiche durante l'arribada (stagione di nidificazione delle tartarughe), con l'obiettivo di ridurre l'impatto negativo del turismo sulle specie che nidificano nel Rifugio Nazionale di Vita Selvatica Ostional.

