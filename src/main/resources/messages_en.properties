inicio.bienvenida=Welcome to AGLO
inicio.descripcion=We work for the conservation of sea turtles and the responsible management of tourism in Ostional, Costa Rica.
inicio.verVideo=Watch video

nosotros.subtitulo=ABOUT US
nosotros.titulo=Conservation, community, and responsible tourism
nosotros.descripcion=Created in 2006 to keep tourist activity under control during the "arribada" phenomenon, successfully reducing the negative impact of tourism on the species nesting in the Refuge. The Association of Local Guides of Ostional (AGLO) is a community organization in Ostional, Costa Rica, focused on managing and controlling tourism to mitigate its negative impact on local wildlife, particularly olive ridley sea turtles. They offer guided tours to educate visitors about the turtle nesting phenomenon and ongoing conservation efforts. AGLO also contributes to various community activities and addresses the needs of those requesting assistance. Its mission is to maintain control over tourist activities during the arribada (turtle nesting season), aiming to reduce the negative impact of tourism on species nesting in the Ostional National Wildlife Refuge.

