<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{accesoDenegado.meta}, 'login.css')}"></head>
    <body>
        <section class="fondo">
            <div class="overlay"></div>
            <header class="navbar">
                <div class="logo">
                    <img th:src="@{/img/logoAglo.png}" src="/img/logoAglo.png" alt="Logo AGLO"/>
                    <h2>AGLO</h2>
                </div>
            </header>
            <main class="contenedor">
                <div class="cardRegistro">
                    <h1 th:text="#{accesoDenegado.titulo}">Acceso denegado</h1>
                    <p th:text="#{accesoDenegado.descripcion}">No cuenta con permisos para acceder a esta página.</p>
                    <p class="login"><a th:href="@{/}" th:text="#{auth.volverInicio}">Volver al inicio</a></p>
                </div>
            </main>
        </section>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
