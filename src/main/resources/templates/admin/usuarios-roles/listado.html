<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{usuarioRol.meta.listado}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{usuarioRol.titulo}">Roles por usuario</h1>
                    <p th:text="#{usuarioRol.descripcionPagina}">Asignación directa de roles a usuarios existentes.</p>
                </div>
                <a class="btn btn-light" th:href="@{/admin/usuarios/listado}" th:text="#{usuario.titulo}">Usuarios</a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <form class="form-grid" th:action="@{/admin/usuarios-roles/listado}" method="get">
                    <div class="full-row">
                        <label class="form-label" for="idUsuarioFiltro" th:text="#{usuarioRol.usuario}">Usuario</label>
                        <select class="form-select" id="idUsuarioFiltro" name="idUsuario" onchange="this.form.submit()">
                            <option value="" th:text="#{general.seleccione}">Seleccione</option>
                            <option th:each="usuario : ${usuarios}" th:value="${usuario.idUsuario}"
                                    th:selected="${idUsuario != null and idUsuario == usuario.idUsuario}"
                                    th:text="${usuario.nombre + ' ' + usuario.apellidoPaterno + ' - ' + usuario.correo}">Usuario</option>
                        </select>
                    </div>
                </form>
            </section>
            <section class="admin-panel" th:if="${idUsuario != null}">
                <form class="form-grid" th:action="@{/admin/usuarios-roles/guardar}" method="post">
                    <input type="hidden" name="idUsuario" th:value="${idUsuario}"/>
                    <div>
                        <label class="form-label" for="idRol" th:text="#{usuarioRol.rol}">Rol</label>
                        <select class="form-select" id="idRol" name="idRol" required>
                            <option value="" th:text="#{general.seleccione}">Seleccione</option>
                            <option th:each="rol : ${roles}" th:value="${rol.idRol}" th:text="${rol.rol}">CLIENTE</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-success" type="submit" th:text="#{accion.asignar}">Asignar</button>
                    </div>
                </form>
            </section>
            <section class="admin-panel">
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th th:text="#{usuarioRol.usuario}">Usuario</th>
                                <th th:text="#{usuarioRol.rol}">Rol</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${idUsuario == null}">
                                <td colspan="3" class="empty-row" th:text="#{usuarioRol.seleccioneUsuario}">Seleccione un usuario para ver sus roles.</td>
                            </tr>
                            <tr th:if="${idUsuario != null and (asignaciones == null or asignaciones.empty)}">
                                <td colspan="3" class="empty-row" th:text="#{usuarioRol.sinRoles}">Este usuario no tiene roles asignados.</td>
                            </tr>
                            <tr th:each="asignacion : ${asignaciones}">
                                <td th:text="${asignacion.usuario != null ? asignacion.usuario.nombre + ' ' + asignacion.usuario.apellidoPaterno : #messages.msg('general.usuario')}">Usuario</td>
                                <td th:text="${asignacion.rol != null ? asignacion.rol.rol : #messages.msg('usuarioRol.rol')}">CLIENTE</td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/usuarios-roles/eliminar}"
                                            data-delete-field="idRol"
                                            th:data-delete-id="${asignacion.rol.idRol}"
                                            data-delete-extra-field="idUsuario"
                                            th:data-delete-extra-value="${asignacion.usuario.idUsuario}"
                                            th:data-delete-name="${asignacion.rol.rol}"
                                            th:text="#{accion.remover}">Remover</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <th:block th:replace="~{admin/fragmentos :: delete-modal}"></th:block>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
