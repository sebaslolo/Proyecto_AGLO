<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{monitoreo.meta.formulario}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="${monitoreo.idMonitoreo == null} ? #{monitoreo.nuevo} : #{monitoreo.editar}">Monitoreo</h1>
                    <p th:text="#{monitoreo.descripcionFormulario}">Asigne el guía responsable y la fecha del recorrido.</p>
                </div>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <form th:action="@{/admin/monitoreos/guardar}" th:object="${monitoreo}" method="post" class="was-validated">
                    <input type="hidden" th:field="*{idMonitoreo}"/>
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger form-errors" role="alert">
                        <strong th:text="#{formulario.invalido}">Revise los datos indicados.</strong>
                        <ul class="mb-0 mt-2">
                            <li th:each="fieldError : ${#fields.allErrors()}" th:text="${fieldError}"></li>
                        </ul>
                    </div>
                    <div class="form-grid">
                        <div>
                            <label class="form-label" for="idGuia" th:text="#{monitoreo.guia}">Guía</label>
                            <select class="form-select" id="idGuia" name="guia.idGuia" required>
                                <option value="" th:text="#{general.seleccione}">Seleccione</option>
                                <option th:each="guiaItem : ${guias}"
                                        th:value="${guiaItem.idGuia}"
                                        th:selected="${monitoreo.guia != null and monitoreo.guia.idGuia == guiaItem.idGuia}"
                                        th:text="${guiaItem.usuario != null} ? ${guiaItem.usuario.nombre + ' ' + guiaItem.usuario.apellidoPaterno} : #{monitoreo.guiaSinUsuario}">Guía</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="idEstado" th:text="#{monitoreo.estado}">Estado</label>
                            <select class="form-select" id="idEstado" name="estado.idEstado" required>
                                <option value="" th:text="#{general.seleccione}">Seleccione</option>
                                <option th:each="estadoItem : ${estados}"
                                        th:value="${estadoItem.idEstado}"
                                        th:selected="${monitoreo.estado != null and monitoreo.estado.idEstado == estadoItem.idEstado}"
                                        th:text="${estadoItem.nombreEstado}">Activo</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="fechaMonitoreo" th:text="#{monitoreo.fechaHora}">Fecha y hora</label>
                            <input class="form-control" type="datetime-local" id="fechaMonitoreo" name="fechaMonitoreo"
                                   th:value="${monitoreo.fechaMonitoreo != null ? #temporals.format(monitoreo.fechaMonitoreo, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="btn btn-outline-dark" th:href="@{/admin/monitoreos/listado}">
                            <span th:text="#{accion.cancelar}">Cancelar</span>
                        </a>
                        <button class="btn btn-success" type="submit">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span th:text="#{accion.guardar}">Guardar</span>
                        </button>
                    </div>
                </form>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
