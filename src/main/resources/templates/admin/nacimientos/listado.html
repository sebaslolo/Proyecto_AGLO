<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head('Nacimientos | AGLO', 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1>Nacimientos</h1>
                    <p>Registro de eclosiones y crías por nido.</p>
                </div>
                <a class="btn page-action" th:href="@{/admin/nacimientos/nuevo}">
                    <i class="fa-solid fa-plus"></i> Nuevo nacimiento
                </a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>

            <section class="admin-panel">
                <p class="admin-summary" th:text="${totalNacimientos} + ' nacimiento(s) registrado(s)'">0 nacimientos registrados</p>
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th>Nido</th>
                                <th>Eclosión</th>
                                <th>Vivas</th>
                                <th>Muertas</th>
                                <th>Infértiles</th>
                                <th>Estado</th>
                                <th class="actions-header">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${nacimientos == null or nacimientos.empty}">
                                <td colspan="7" class="empty-row">No hay nacimientos registrados.</td>
                            </tr>
                            <tr th:each="nacimiento : ${nacimientos}">
                                <td th:text="${nacimiento.nido != null and nacimiento.nido.tortuga != null ? 'Tortuga ' + nacimiento.nido.tortuga.etiquetaTortuga : (nacimiento.nido != null ? (nacimiento.nido.ubicacion ?: 'Nido sin datos de ubicación') : 'Sin nido')}">Tortuga T-001</td>
                                <td th:text="${nacimiento.fechaEclosion != null ? #temporals.format(nacimiento.fechaEclosion, 'dd/MM/yyyy HH:mm') : 'Sin fecha'}">14/08/2026</td>
                                <td th:text="${nacimiento.criasVivas ?: '0'}">50</td>
                                <td th:text="${nacimiento.criasMuertas ?: '0'}">2</td>
                                <td th:text="${nacimiento.criasInfertiles ?: '0'}">3</td>
                                <td th:text="${nacimiento.estado != null ? nacimiento.estado.nombreEstado : 'Sin estado'}">Activo</td>
                                <td class="table-actions">
                                    <a class="btn btn-sm btn-outline-dark"
                                       th:href="@{/admin/nacimientos/modificar/{id}(id=${nacimiento.idNacimiento})}">
                                        <i class="fa-solid fa-pen"></i> Editar
                                    </a>
                                    <button th:if="${isAdmin}" class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/nacimientos/eliminar}"
                                            data-delete-field="idNacimiento"
                                            th:data-delete-id="${nacimiento.idNacimiento}"
                                            th:data-delete-name="${nacimiento.fechaEclosion != null ? 'nacimiento del ' + #temporals.format(nacimiento.fechaEclosion, 'dd/MM/yyyy') : 'nacimiento sin fecha registrada'}">
                                        <i class="fa-solid fa-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <div th:replace="~{admin/fragmentos :: delete-modal}"></div>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
