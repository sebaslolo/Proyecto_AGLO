<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head('Nido | AGLO', 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="${nido.idNido == null ? 'Nuevo nido' : 'Editar nido'}">Nido</h1>
                    <p>Registre los datos del nido y la tortuga asociada.</p>
                </div>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>

            <section class="admin-panel">
                <form th:action="@{/admin/nidos/guardar}" th:object="${nido}" method="post" class="was-validated">
                    <input type="hidden" th:field="*{idNido}"/>
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger form-errors" role="alert">
                        <strong>Revise los datos indicados.</strong>
                        <ul class="mb-0 mt-2"><li th:each="fieldError : ${#fields.allErrors()}" th:text="${fieldError}">Error de validación</li></ul>
                    </div>
                    <div class="form-grid">
                        <div>
                            <label class="form-label" for="etiquetaTortuga">Tortuga</label>
                            <select class="form-select" id="etiquetaTortuga" name="tortuga.etiquetaTortuga" required>
                                <option value="">Seleccione</option>
                                <option th:each="tortugaItem : ${tortugas}"
                                        th:value="${tortugaItem.etiquetaTortuga}"
                                        th:selected="${nido.tortuga != null and nido.tortuga.etiquetaTortuga == tortugaItem.etiquetaTortuga}"
                                        th:text="${tortugaItem.etiquetaTortuga + ' — ' + tortugaItem.especie}">T-001</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="idEstado">Estado</label>
                            <select class="form-select" id="idEstado" name="estado.idEstado" required>
                                <option value="">Seleccione</option>
                                <option th:each="estadoItem : ${estados}"
                                        th:value="${estadoItem.idEstado}"
                                        th:selected="${nido.estado != null and nido.estado.idEstado == estadoItem.idEstado}"
                                        th:text="${estadoItem.nombreEstado}">Activo</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="ubicacion">Ubicación</label>
                            <input class="form-control" type="text" th:field="*{ubicacion}" maxlength="100"/>
                        </div>
                        <div>
                            <label class="form-label" for="fechaAnidacion">Fecha y hora de anidación</label>
                            <input class="form-control" type="datetime-local" id="fechaAnidacion" name="fechaAnidacion"
                                   th:value="${nido.fechaAnidacion != null ? #temporals.format(nido.fechaAnidacion, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
                        </div>
                        <div>
                            <label class="form-label" for="cantidadHuevos">Cantidad de huevos</label>
                            <input class="form-control" type="number" th:field="*{cantidadHuevos}" min="0"/>
                        </div>
                        <div>
                            <label class="form-label" for="profundidadNido">Profundidad del nido</label>
                            <input class="form-control" type="number" th:field="*{profundidadNido}" min="0"/>
                        </div>
                        <div class="full-row">
                            <label class="form-label" for="observaciones">Observaciones</label>
                            <textarea class="form-control" th:field="*{observaciones}" rows="4" maxlength="255"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="btn btn-outline-dark" th:href="@{/admin/nidos/listado}">Cancelar</a>
                        <button class="btn btn-success" type="submit"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                    </div>
                </form>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
