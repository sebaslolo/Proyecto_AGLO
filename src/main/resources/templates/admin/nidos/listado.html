<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{nido.meta.listado}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{nido.titulo}">Nidos</h1>
                    <p th:text="#{nido.descripcionPagina}">Control de nidos registrados durante las temporadas.</p>
                </div>
                <a class="btn page-action" th:href="@{/admin/nidos/nuevo}">
                    <i class="fa-solid fa-plus"></i>
                    <span th:text="#{nido.nuevo}">Nuevo nido</span>
                </a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <p class="admin-summary" th:text="#{nido.resumen(${totalNidos})}">Nidos registrados: 0</p>
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th th:text="#{nido.tortuga}">Tortuga</th>
                                <th th:text="#{nido.ubicacion}">Ubicación</th>
                                <th th:text="#{nido.anidacion}">Anidación</th>
                                <th th:text="#{nido.huevos}">Huevos</th>
                                <th th:text="#{nido.estado}">Estado</th>
                                <th class="actions-header" th:text="#{general.acciones}">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${nidos == null or nidos.empty}">
                                <td colspan="6" class="empty-row" th:text="#{nido.sinRegistros}">No hay nidos registrados.</td>
                            </tr>
                            <tr th:each="nido : ${nidos}">
                                <td th:text="${nido.tortuga != null} ? ${nido.tortuga.etiquetaTortuga} : #{general.sinTortuga}">T-001</td>
                                <td th:text="${nido.ubicacion != null and !nido.ubicacion.isBlank()} ? ${nido.ubicacion} : #{general.sinUbicacion}">Playa</td>
                                <td th:text="${nido.fechaAnidacion != null} ? ${#temporals.format(nido.fechaAnidacion, 'dd/MM/yyyy HH:mm')} : #{general.sinFecha}">14/08/2026</td>
                                <td th:text="${nido.cantidadHuevos != null} ? ${nido.cantidadHuevos} : #{general.sinDato}">80</td>
                                <td th:text="${nido.estado != null} ? ${nido.estado.nombreEstado} : #{general.sinEstado}">Activo</td>
                                <td class="table-actions">
                                    <a class="btn btn-sm btn-outline-dark"
                                       th:href="@{/admin/nidos/modificar/{id}(id=${nido.idNido})}">
                                        <i class="fa-solid fa-pen"></i>
                                        <span th:text="#{accion.editar}">Editar</span>
                                    </a>
                                    <button th:if="${isAdmin}" class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/nidos/eliminar}"
                                            data-delete-field="idNido"
                                            th:data-delete-id="${nido.idNido}"
                                            th:data-delete-name="${nido.tortuga != null} ? #{nido.eliminar.referencia(${nido.tortuga.etiquetaTortuga})} : (${nido.ubicacion != null and !nido.ubicacion.isBlank()} ? ${nido.ubicacion} : #{nido.sinDatosUbicacion})">
                                        <i class="fa-solid fa-trash"></i>
                                        <span th:text="#{accion.eliminar}">Eliminar</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <div th:replace="~{admin/fragmentos :: delete-modal}"></div>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
