<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{ruta.meta.listado}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{ruta.titulo}">Rutas</h1>
                    <p th:text="#{ruta.descripcionPagina}">Listado documental de rutas protegidas y públicas.</p>
                </div>
                <a class="btn btn-light" th:href="@{/admin/rutas/nuevo}" th:text="#{ruta.nueva}">Nueva</a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <p class="admin-note" role="note">
                    <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                    <span th:text="#{ruta.aviso.estatico}">El catálogo de rutas es informativo. La autorización se define en el código de la aplicación.</span>
                </p>
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead><tr><th th:text="#{ruta.ruta}">Ruta</th><th th:text="#{ruta.rol}">Rol</th><th th:text="#{ruta.requiereRol}">Requiere rol</th><th></th></tr></thead>
                        <tbody>
                            <tr th:if="${rutas == null or rutas.empty}">
                                <td colspan="4" class="empty-row" th:text="#{ruta.sinRegistros}">No hay rutas registradas.</td>
                            </tr>
                            <tr th:each="ruta : ${rutas}">
                                <td th:text="${ruta.ruta}">/admin/**</td>
                                <td th:text="${ruta.rol != null ? ruta.rol.rol : #messages.msg('ruta.publica')}">ADMIN</td>
                                <td th:text="${ruta.requiereRol ? #messages.msg('general.si') : #messages.msg('general.no')}">Sí</td>
                                <td class="text-end">
                                    <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/rutas/modificar/{id}(id=${ruta.idRuta})}" th:text="#{accion.editar}">Editar</a>
                                    <button class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/rutas/eliminar}"
                                            data-delete-field="idRuta"
                                            th:data-delete-id="${ruta.idRuta}"
                                            th:data-delete-name="${ruta.ruta}"
                                            th:text="#{accion.eliminar}">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <th:block th:replace="~{admin/fragmentos :: delete-modal}"></th:block>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
