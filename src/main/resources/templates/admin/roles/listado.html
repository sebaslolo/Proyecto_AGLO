<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{rol.meta.listado}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{rol.titulo}">Roles</h1>
                    <p th:text="#{rol.descripcionPagina}">Roles usados por la sesión administrativa.</p>
                </div>
                <a class="btn btn-light" th:href="@{/admin/roles/nuevo}" th:text="#{accion.nuevo}">Nuevo</a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead><tr><th th:text="#{rol.rol}">Rol</th><th></th></tr></thead>
                        <tbody>
                            <tr th:if="${roles == null or roles.empty}">
                                <td colspan="2" class="empty-row" th:text="#{rol.sinRegistros}">No hay roles registrados.</td>
                            </tr>
                            <tr th:each="rol : ${roles}">
                                <td th:text="${rol.rol}">ADMIN</td>
                                <td class="text-end">
                                    <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/roles/modificar/{id}(id=${rol.idRol})}" th:text="#{accion.editar}">Editar</a>
                                    <button class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/roles/eliminar}"
                                            data-delete-field="idRol"
                                            th:data-delete-id="${rol.idRol}"
                                            th:data-delete-name="${rol.rol}"
                                            th:text="#{accion.eliminar}">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <th:block th:replace="~{admin/fragmentos :: delete-modal}"></th:block>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
