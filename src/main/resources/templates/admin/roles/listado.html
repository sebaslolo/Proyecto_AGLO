<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head('Roles | AGLO', 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1>Roles</h1>
                    <p>Roles usados por la sesion administrativa.</p>
                </div>
                <a class="btn btn-light" th:href="@{/admin/roles/nuevo}">Nuevo</a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead><tr><th>Rol</th><th></th></tr></thead>
                        <tbody>
                            <tr th:if="${roles == null or roles.empty}">
                                <td colspan="2" class="empty-row">No hay roles registrados.</td>
                            </tr>
                            <tr th:each="rol : ${roles}">
                                <td th:text="${rol.rol}">ADMIN</td>
                                <td class="text-end">
                                    <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/roles/modificar/{id}(id=${rol.idRol})}">Editar</a>
                                    <button class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/roles/eliminar}"
                                            data-delete-field="idRol"
                                            th:data-delete-id="${rol.idRol}"
                                            th:data-delete-name="${rol.rol}">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <th:block th:replace="~{admin/fragmentos :: delete-modal}"></th:block>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
