<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head('Avistamiento | AGLO', 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="${avistamiento.idAvistamiento == null ? 'Nuevo avistamiento' : 'Editar avistamiento'}">Avistamiento</h1>
                    <p>Registre la ubicación y comportamiento observado.</p>
                </div>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>

            <section class="admin-panel">
                <form th:action="@{/admin/avistamientos/guardar}" th:object="${avistamiento}" method="post" class="was-validated">
                    <input type="hidden" th:field="*{idAvistamiento}"/>
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger form-errors" role="alert">
                        <strong>Revise los datos indicados.</strong>
                        <ul class="mb-0 mt-2"><li th:each="fieldError : ${#fields.allErrors()}" th:text="${fieldError}">Error de validación</li></ul>
                    </div>
                    <div class="form-grid">
                        <div>
                            <label class="form-label" for="etiquetaTortuga">Tortuga</label>
                            <select class="form-select" id="etiquetaTortuga" name="tortuga.etiquetaTortuga" required>
                                <option value="">Seleccione</option>
                                <option th:each="tortugaItem : ${tortugas}"
                                        th:value="${tortugaItem.etiquetaTortuga}"
                                        th:selected="${avistamiento.tortuga != null and avistamiento.tortuga.etiquetaTortuga == tortugaItem.etiquetaTortuga}"
                                        th:text="${tortugaItem.etiquetaTortuga + ' — ' + tortugaItem.especie}">T-001</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="idEstado">Estado</label>
                            <select class="form-select" id="idEstado" name="estado.idEstado" required>
                                <option value="">Seleccione</option>
                                <option th:each="estadoItem : ${estados}"
                                        th:value="${estadoItem.idEstado}"
                                        th:selected="${avistamiento.estado != null and avistamiento.estado.idEstado == estadoItem.idEstado}"
                                        th:text="${estadoItem.nombreEstado}">Activo</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="comportamiento">Comportamiento</label>
                            <input class="form-control" type="text" th:field="*{comportamiento}" maxlength="100" required/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('comportamiento')}" th:errors="*{comportamiento}">Dato requerido</div>
                        </div>
                        <div>
                            <label class="form-label" for="ubicacion">Ubicación</label>
                            <input class="form-control" type="text" th:field="*{ubicacion}" maxlength="100" required/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('ubicacion')}" th:errors="*{ubicacion}">Dato requerido</div>
                        </div>
                        <div>
                            <label class="form-label" for="fechaAvistamiento">Fecha y hora</label>
                            <input class="form-control" type="datetime-local" id="fechaAvistamiento" name="fechaAvistamiento"
                                   th:value="${avistamiento.fechaAvistamiento != null ? #temporals.format(avistamiento.fechaAvistamiento, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
                        </div>
                        <div class="full-row">
                            <label class="form-label" for="observaciones">Observaciones</label>
                            <textarea class="form-control" th:field="*{observaciones}" rows="4" maxlength="255"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="btn btn-outline-dark" th:href="@{/admin/avistamientos/listado}">Cancelar</a>
                        <button class="btn btn-success" type="submit"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                    </div>
                </form>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
