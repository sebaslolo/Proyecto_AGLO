<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{avistamiento.meta.listado}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{avistamiento.titulo}">Avistamientos</h1>
                    <p th:text="#{avistamiento.descripcionPagina}">Registro de observaciones de tortugas en campo.</p>
                </div>
                <a class="btn page-action" th:href="@{/admin/avistamientos/nuevo}">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    <span th:text="#{avistamiento.nuevo}">Nuevo avistamiento</span>
                </a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <p class="admin-summary" th:text="#{avistamiento.resumen(${totalAvistamientos})}">0 avistamientos registrados</p>
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th th:text="#{avistamiento.tortuga}">Tortuga</th>
                                <th th:text="#{avistamiento.comportamiento}">Comportamiento</th>
                                <th th:text="#{avistamiento.ubicacion}">Ubicación</th>
                                <th th:text="#{avistamiento.fecha}">Fecha</th>
                                <th th:text="#{avistamiento.estado}">Estado</th>
                                <th class="actions-header" th:text="#{general.acciones}">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${avistamientos == null or avistamientos.empty}">
                                <td colspan="6" class="empty-row" th:text="#{avistamiento.sinRegistros}">No hay avistamientos registrados.</td>
                            </tr>
                            <tr th:each="avistamiento : ${avistamientos}">
                                <td th:text="${avistamiento.tortuga != null ? avistamiento.tortuga.etiquetaTortuga : #messages.msg('avistamiento.sinTortuga')}">T-001</td>
                                <td th:text="${avistamiento.comportamiento}">Anidando</td>
                                <td th:text="${avistamiento.ubicacion}">Playa</td>
                                <td th:text="${avistamiento.fechaAvistamiento != null
                                    ? #temporals.format(avistamiento.fechaAvistamiento, 'dd/MM/yyyy HH:mm')
                                    : #messages.msg('general.sinFecha')}">14/08/2026 20:00</td>
                                <td th:text="${avistamiento.estado != null ? avistamiento.estado.nombreEstado : #messages.msg('general.sinEstado')}">Activo</td>
                                <td class="table-actions">
                                    <a class="btn btn-sm btn-outline-dark"
                                       th:href="@{/admin/avistamientos/modificar/{id}(id=${avistamiento.idAvistamiento})}">
                                        <i class="fa-solid fa-pen" aria-hidden="true"></i>
                                        <span th:text="#{accion.editar}">Editar</span>
                                    </a>
                                    <button th:if="${isAdmin}" class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/avistamientos/eliminar}"
                                            data-delete-field="idAvistamiento"
                                            th:data-delete-id="${avistamiento.idAvistamiento}"
                                            th:data-delete-name="${avistamiento.tortuga != null
                                                ? #messages.msg('avistamiento.eliminar.referencia', avistamiento.tortuga.etiquetaTortuga)
                                                : #messages.msg('avistamiento.eliminar.sinTortuga')}">
                                        <i class="fa-solid fa-trash" aria-hidden="true"></i>
                                        <span th:text="#{accion.eliminar}">Eliminar</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <div th:replace="~{admin/fragmentos :: delete-modal}"></div>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
