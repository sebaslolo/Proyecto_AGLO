<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{usuario.meta.listado}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{usuario.titulo}">Usuarios</h1>
                    <p th:text="#{usuario.descripcionPagina}">Listado y mantenimiento de usuarios registrados.</p>
                </div>
                <a class="btn btn-light" th:href="@{/admin/usuarios/nuevo}">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    <span th:text="#{usuario.agregar}">Crear usuario</span>
                </a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <form class="search-form mb-3" th:action="@{/admin/usuarios/listado}" method="get">
                    <input class="form-control form-control-sm" type="search" name="q" th:value="${q}" th:placeholder="#{usuario.buscarPlaceholder}"/>
                    <button class="btn btn-sm btn-outline-dark" type="submit" th:attr="aria-label=#{accion.buscar}">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    </button>
                </form>
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th th:text="#{usuario.nombre}">Nombre</th>
                                <th th:text="#{usuario.correo}">Correo</th>
                                <th th:text="#{usuario.rol}">Rol</th>
                                <th th:text="#{usuario.estado}">Estado</th>
                                <th th:text="#{usuario.fechaCreacion}">Fecha registro</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${usuarios == null or usuarios.empty}">
                                <td colspan="6" class="empty-row" th:text="#{usuario.sinRegistros}">No hay usuarios registrados.</td>
                            </tr>
                            <tr th:each="usuario : ${usuarios}">
                                <td th:text="${usuario.nombre + ' ' + usuario.apellidoPaterno}">Nombre</td>
                                <td th:text="${usuario.correo}">correo@aglo.cr</td>
                                <td th:text="${rolesPorUsuario[usuario.idUsuario] != null and !rolesPorUsuario[usuario.idUsuario].isEmpty() ? rolesPorUsuario[usuario.idUsuario] : #messages.msg('usuario.sinRol')}">CLIENTE</td>
                                <td th:text="${usuario.estado != null ? usuario.estado.nombreEstado : #messages.msg('general.sinEstado')}">Activo</td>
                                <td th:text="${usuario.fechaCreacion != null ? #temporals.format(usuario.fechaCreacion, #messages.msg('formato.fechaCorta')) : #messages.msg('general.sinFecha')}">01/01/2026</td>
                                <td class="text-end">
                                    <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/usuarios/modificar/{id}(id=${usuario.idUsuario})}">
                                        <i class="fa-solid fa-pen" aria-hidden="true"></i>
                                        <span th:text="#{accion.editar}">Editar</span>
                                    </a>
                                    <button class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-id="${usuario.idUsuario}"
                                            th:data-delete-action="@{/admin/usuarios/eliminar}"
                                            data-delete-field="idUsuario"
                                            th:data-delete-name="${usuario.nombre + ' ' + usuario.apellidoPaterno}">
                                        <i class="fa-solid fa-trash" aria-hidden="true"></i>
                                        <span th:text="#{accion.eliminar}">Eliminar</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <th:block th:replace="~{admin/fragmentos :: delete-modal}"></th:block>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
