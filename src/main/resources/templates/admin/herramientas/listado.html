<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head('Herramientas | AGLO', 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1>Herramientas</h1>
                    <p>Inventario de herramientas disponibles para el equipo.</p>
                </div>
                <a class="btn page-action" th:href="@{/admin/herramientas/nuevo}">
                    <i class="fa-solid fa-plus"></i> Nueva herramienta
                </a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>

            <section class="admin-panel">
                <p class="admin-summary" th:text="${totalHerramientas} + ' herramienta(s) registrada(s)'">0 herramientas registradas</p>
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Estado</th>
                                <th>Creación</th>
                                <th class="actions-header">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${herramientas == null or herramientas.empty}">
                                <td colspan="5" class="empty-row">No hay herramientas registradas.</td>
                            </tr>
                            <tr th:each="herramienta : ${herramientas}">
                                <td th:text="${herramienta.nombreHerramienta}">Linterna</td>
                                <td th:text="${herramienta.descripcion ?: 'Sin descripción'}">Descripción</td>
                                <td th:text="${herramienta.estado != null ? herramienta.estado.nombreEstado : 'Sin estado'}">Activo</td>
                                <td th:text="${herramienta.fechaCreacion != null ? #temporals.format(herramienta.fechaCreacion, 'dd/MM/yyyy') : 'Sin fecha'}">14/08/2026</td>
                                <td class="table-actions">
                                    <a class="btn btn-sm btn-outline-dark"
                                       th:href="@{/admin/herramientas/modificar/{id}(id=${herramienta.idHerramienta})}">
                                        <i class="fa-solid fa-pen"></i> Editar
                                    </a>
                                    <button th:if="${isAdmin}" class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/herramientas/eliminar}"
                                            data-delete-field="idHerramienta"
                                            th:data-delete-id="${herramienta.idHerramienta}"
                                            th:data-delete-name="${herramienta.nombreHerramienta}">
                                        <i class="fa-solid fa-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <div th:replace="~{admin/fragmentos :: delete-modal}"></div>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
