<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{herramienta.meta.formulario}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="${herramienta.idHerramienta == null} ? #{herramienta.nueva} : #{herramienta.editar}">Herramienta</h1>
                    <p th:text="#{herramienta.descripcionFormulario}">Gestione el inventario de apoyo para las actividades.</p>
                </div>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <form th:action="@{/admin/herramientas/guardar}" th:object="${herramienta}" method="post" class="was-validated">
                    <input type="hidden" th:field="*{idHerramienta}"/>
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger form-errors" role="alert">
                        <strong th:text="#{formulario.invalido}">Revise los datos indicados.</strong>
                        <ul class="mb-0 mt-2">
                            <li th:each="fieldError : ${#fields.allErrors()}" th:text="${fieldError}"></li>
                        </ul>
                    </div>
                    <div class="form-grid">
                        <div class="full-row">
                            <label class="form-label" for="nombreHerramienta" th:text="#{herramienta.nombre}">Nombre</label>
                            <input class="form-control" type="text" th:field="*{nombreHerramienta}" maxlength="100" required/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreHerramienta')}" th:errors="*{nombreHerramienta}">Dato requerido</div>
                        </div>
                        <div>
                            <label class="form-label" for="idEstado" th:text="#{herramienta.estado}">Estado</label>
                            <select class="form-select" id="idEstado" name="estado.idEstado" required>
                                <option value="" th:text="#{general.seleccione}">Seleccione</option>
                                <option th:each="estadoItem : ${estados}"
                                        th:value="${estadoItem.idEstado}"
                                        th:selected="${herramienta.estado != null and herramienta.estado.idEstado == estadoItem.idEstado}"
                                        th:text="${estadoItem.nombreEstado}">Activo</option>
                            </select>
                        </div>
                        <div class="full-row">
                            <label class="form-label" for="descripcion" th:text="#{herramienta.descripcion}">Descripción</label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="4" maxlength="255"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="btn btn-outline-dark" th:href="@{/admin/herramientas/listado}">
                            <span th:text="#{accion.cancelar}">Cancelar</span>
                        </a>
                        <button class="btn btn-success" type="submit">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span th:text="#{accion.guardar}">Guardar</span>
                        </button>
                    </div>
                </form>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
