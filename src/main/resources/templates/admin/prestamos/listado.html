<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{prestamo.meta.listado}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{prestamo.titulo}">Préstamos</h1>
                    <p th:text="#{prestamo.descripcionPagina}">Control de préstamos y devoluciones de herramientas.</p>
                </div>
                <a class="btn page-action" th:href="@{/admin/prestamos/nuevo}">
                    <i class="fa-solid fa-plus"></i>
                    <span th:text="#{prestamo.nuevo}">Nuevo préstamo</span>
                </a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <p class="admin-summary" th:text="#{prestamo.resumen(${totalPrestamos})}">Préstamos registrados: 0</p>
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th th:text="#{prestamo.herramienta}">Herramienta</th>
                                <th th:text="#{prestamo.usuario}">Usuario</th>
                                <th th:text="#{prestamo.fechaPrestamo}">Fecha de préstamo</th>
                                <th th:text="#{prestamo.devolucion}">Devolución</th>
                                <th th:text="#{prestamo.estado}">Estado</th>
                                <th class="actions-header" th:text="#{general.acciones}">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${prestamos == null or prestamos.empty}">
                                <td colspan="6" class="empty-row" th:text="#{prestamo.sinRegistros}">No hay préstamos registrados.</td>
                            </tr>
                            <tr th:each="prestamo : ${prestamos}">
                                <td th:text="${prestamo.herramienta != null} ? ${prestamo.herramienta.nombreHerramienta} : #{general.sinHerramienta}">Linterna</td>
                                <td th:text="${prestamo.usuario != null} ? ${prestamo.usuario.nombre + ' ' + prestamo.usuario.apellidoPaterno} : #{general.sinUsuario}">Usuario</td>
                                <td th:text="${prestamo.fechaPrestamo != null} ? ${#temporals.format(prestamo.fechaPrestamo, 'dd/MM/yyyy')} : #{general.sinFecha}">14/08/2026</td>
                                <td th:text="${prestamo.fechaDevolucion != null} ? ${#temporals.format(prestamo.fechaDevolucion, 'dd/MM/yyyy')} : #{general.pendiente}">15/08/2026</td>
                                <td th:text="${prestamo.estado != null} ? ${prestamo.estado.nombreEstado} : #{general.sinEstado}">Activo</td>
                                <td class="table-actions">
                                    <a class="btn btn-sm btn-outline-dark"
                                       th:href="@{/admin/prestamos/modificar/{id}(id=${prestamo.idPrestamo})}">
                                        <i class="fa-solid fa-pen"></i>
                                        <span th:text="#{accion.editar}">Editar</span>
                                    </a>
                                    <button th:if="${isAdmin}" class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/prestamos/eliminar}"
                                            data-delete-field="idPrestamo"
                                            th:data-delete-id="${prestamo.idPrestamo}"
                                            th:data-delete-name="${prestamo.herramienta != null} ? #{prestamo.eliminar.referencia(${prestamo.herramienta.nombreHerramienta})} : #{prestamo.eliminar.sinHerramienta}">
                                        <i class="fa-solid fa-trash"></i>
                                        <span th:text="#{accion.eliminar}">Eliminar</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <div th:replace="~{admin/fragmentos :: delete-modal}"></div>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
