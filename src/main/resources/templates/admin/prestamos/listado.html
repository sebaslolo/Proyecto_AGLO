<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head('Préstamos | AGLO', 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1>Préstamos</h1>
                    <p>Control de préstamos y devoluciones de herramientas.</p>
                </div>
                <a class="btn page-action" th:href="@{/admin/prestamos/nuevo}">
                    <i class="fa-solid fa-plus"></i> Nuevo préstamo
                </a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>

            <section class="admin-panel">
                <p class="admin-summary" th:text="${totalPrestamos} + ' préstamo(s) registrado(s)'">0 préstamos registrados</p>
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th>Herramienta</th>
                                <th>Usuario</th>
                                <th>Fecha de préstamo</th>
                                <th>Devolución</th>
                                <th>Estado</th>
                                <th class="actions-header">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${prestamos == null or prestamos.empty}">
                                <td colspan="6" class="empty-row">No hay préstamos registrados.</td>
                            </tr>
                            <tr th:each="prestamo : ${prestamos}">
                                <td th:text="${prestamo.herramienta != null ? prestamo.herramienta.nombreHerramienta : 'Sin herramienta'}">Linterna</td>
                                <td th:text="${prestamo.usuario != null ? prestamo.usuario.nombre + ' ' + prestamo.usuario.apellidoPaterno : 'Sin usuario'}">Usuario</td>
                                <td th:text="${prestamo.fechaPrestamo != null ? #temporals.format(prestamo.fechaPrestamo, 'dd/MM/yyyy') : 'Sin fecha'}">14/08/2026</td>
                                <td th:text="${prestamo.fechaDevolucion != null ? #temporals.format(prestamo.fechaDevolucion, 'dd/MM/yyyy') : 'Pendiente'}">15/08/2026</td>
                                <td th:text="${prestamo.estado != null ? prestamo.estado.nombreEstado : 'Sin estado'}">Activo</td>
                                <td class="table-actions">
                                    <a class="btn btn-sm btn-outline-dark"
                                       th:href="@{/admin/prestamos/modificar/{id}(id=${prestamo.idPrestamo})}">
                                        <i class="fa-solid fa-pen"></i> Editar
                                    </a>
                                    <button th:if="${isAdmin}" class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/prestamos/eliminar}"
                                            data-delete-field="idPrestamo"
                                            th:data-delete-id="${prestamo.idPrestamo}"
                                            th:data-delete-name="${prestamo.herramienta != null ? 'préstamo de ' + prestamo.herramienta.nombreHerramienta : 'préstamo sin herramienta asignada'}">
                                        <i class="fa-solid fa-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <div th:replace="~{admin/fragmentos :: delete-modal}"></div>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
