<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{reservacion.meta.listado}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{reservacion.titulo}">Reservaciones</h1>
                    <p th:text="#{reservacion.admin.subtitulo}">Seguimiento administrativo de reservaciones.</p>
                </div>
                <a class="btn btn-success" th:href="@{/admin/reservaciones/nuevo}">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    <span th:text="#{reservacion.admin.nueva}">Nueva reservación</span>
                </a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th th:text="#{reservacion.usuario}">Usuario</th>
                                <th th:text="#{reservacion.fechaReservacion}">Fecha</th>
                                <th th:text="#{reservacion.montoTotal}">Monto</th>
                                <th th:text="#{reservacion.estado}">Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${reservaciones == null or reservaciones.empty}">
                                <td colspan="5" class="empty-row" th:text="#{reservacion.admin.sinRegistros}">No hay reservaciones registradas.</td>
                            </tr>
                            <tr th:each="reservacion : ${reservaciones}">
                                <td th:text="${reservacion.usuario != null ? reservacion.usuario.nombre + ' ' + reservacion.usuario.apellidoPaterno : #messages.msg('reservacion.admin.sinUsuario')}">Cliente</td>
                                <td th:text="${reservacion.fechaReservacion != null ? #temporals.format(reservacion.fechaReservacion, 'dd/MM/yyyy HH:mm') : #messages.msg('reservacion.admin.sinFecha')}">Fecha</td>
                                <td th:text="${reservacion.montoTotal != null ? @monedaCostaRica.formatear(reservacion.montoTotal) : #messages.msg('reservacion.admin.sinMonto')}">₡0</td>
                                <td th:text="${reservacion.estado != null ? reservacion.estado.nombreEstado : #messages.msg('reservacion.admin.sinEstado')}">Pendiente</td>
                                <td class="text-end">
                                    <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/reservaciones/detalle/{id}(id=${reservacion.idReservacion})}">
                                        <i class="fa-solid fa-eye" aria-hidden="true"></i>
                                        <span th:text="#{accion.detalle}">Detalle</span>
                                    </a>
                                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/reservaciones/modificar/{id}(id=${reservacion.idReservacion})}">
                                        <i class="fa-solid fa-pen" aria-hidden="true"></i>
                                        <span th:text="#{reservacion.admin.editarEstado}">Editar estado</span>
                                    </a>
                                    <button class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-id="${reservacion.idReservacion}"
                                            th:data-delete-action="@{/admin/reservaciones/eliminar}"
                                            data-delete-field="idReservacion"
                                            th:data-delete-name="#{reservacion.admin.eliminar.referencia}">
                                        <i class="fa-solid fa-trash" aria-hidden="true"></i>
                                        <span th:text="#{accion.eliminar}">Eliminar</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <th:block th:replace="~{admin/fragmentos :: delete-modal}"></th:block>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
