<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head('Nueva reservación | AGLO', 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{reservacion.admin.nueva.titulo}">Nueva reservación</h1>
                    <p th:text="#{reservacion.admin.nueva.descripcion}">Seleccione un cliente, una actividad y la cantidad de personas.</p>
                </div>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>

            <section class="admin-panel">
                <form th:action="@{/admin/reservaciones/guardar}" th:object="${reservacionAdminForm}" method="post" class="was-validated">
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger form-errors" role="alert">
                        <strong th:text="#{formulario.invalido}">Revise los datos indicados.</strong>
                        <ul class="mb-0 mt-2">
                            <li th:each="fieldError : ${#fields.allErrors()}" th:text="${fieldError}">Error de validación</li>
                        </ul>
                    </div>
                    <div class="form-grid">
                        <div>
                            <label class="form-label" for="idUsuario" th:text="#{reservacion.admin.cliente}">Cliente</label>
                            <select class="form-select" id="idUsuario" th:field="*{idUsuario}" required>
                                <option value="" th:text="#{reservacion.admin.seleccioneCliente}">Seleccione un cliente</option>
                                <option th:each="usuario : ${usuarios}"
                                        th:value="${usuario.idUsuario}"
                                        th:text="${usuario.nombre + ' ' + usuario.apellidoPaterno + ' (' + usuario.username + ')'}">Cliente</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="idActividad" th:text="#{detalle.idActividad}">Actividad</label>
                            <select class="form-select" id="idActividad" th:field="*{idActividad}" required>
                                <option value="" th:text="#{reservacion.admin.seleccioneActividad}">Seleccione una actividad</option>
                                <option th:each="actividad : ${actividades}"
                                        th:value="${actividad.idActividad}"
                                        th:text="${actividad.nombreActividad}">Actividad</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="cantidadPersonas" th:text="#{detalle.cantidadPersonas}">Cantidad de personas</label>
                            <input class="form-control" type="number" id="cantidadPersonas" th:field="*{cantidadPersonas}" min="1" required/>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="btn btn-outline-dark" th:href="@{/admin/reservaciones/listado}" th:text="#{accion.cancelar}">Cancelar</a>
                        <button class="btn btn-success" type="submit">
                            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
                            <span th:text="#{accion.guardar}">Guardar</span>
                        </button>
                    </div>
                </form>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
