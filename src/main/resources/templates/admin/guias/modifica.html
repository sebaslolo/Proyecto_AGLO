<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{guia.meta.formulario}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="${guia.idGuia == null} ? #{guia.agregar} : #{guia.editar}">Guía</h1>
                    <p th:text="#{guia.descripcionFormulario}">Asocie un usuario existente como guía local.</p>
                </div>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <form th:action="@{/admin/guias/guardar}" th:object="${guia}" method="post" class="was-validated">
                    <input type="hidden" th:field="*{idGuia}"/>
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger form-errors" role="alert">
                        <strong th:text="#{formulario.invalido}">Revise los datos indicados.</strong>
                        <ul class="mb-0 mt-2"><li th:each="fieldError : ${#fields.allErrors()}" th:text="${fieldError}">Error de validación</li></ul>
                    </div>
                    <div class="form-grid">
                        <div>
                            <label class="form-label" for="idUsuario" th:text="#{guia.usuario}">Usuario</label>
                            <select class="form-select" id="idUsuario" name="usuario.idUsuario" required>
                                <option value="" th:text="#{general.seleccione}">Seleccione</option>
                                <option th:each="usuario : ${usuarios}" th:value="${usuario.idUsuario}" th:selected="${guia.usuario != null and guia.usuario.idUsuario == usuario.idUsuario}" th:text="${usuario.nombre + ' ' + usuario.apellidoPaterno + ' - ' + usuario.correo}">Usuario</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="idEstado" th:text="#{guia.estado}">Estado</label>
                            <select class="form-select" id="idEstado" name="estado.idEstado" required>
                                <option value="" th:text="#{general.seleccione}">Seleccione</option>
                                <option th:each="estado : ${estados}" th:value="${estado.idEstado}" th:selected="${guia.estado != null and guia.estado.idEstado == estado.idEstado}" th:text="${estado.nombreEstado}">Activo</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="fechaIngreso" th:text="#{guia.fechaIngreso}">Fecha de ingreso</label>
                            <input class="form-control" type="date" id="fechaIngreso" name="fechaIngreso" th:value="${guia.fechaIngreso != null ? #temporals.format(guia.fechaIngreso, 'yyyy-MM-dd') : ''}"/>
                        </div>
                        <div>
                            <label class="form-label" for="disponibilidad" th:text="#{guia.disponibilidad}">Disponibilidad</label>
                            <select class="form-select" th:field="*{disponibilidad}">
                                <option value="" th:text="#{general.seleccione}">Seleccione</option>
                                <option value="true" th:text="#{guia.disponible}">Disponible</option>
                                <option value="false" th:text="#{guia.noDisponible}">No disponible</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="btn btn-outline-dark" th:href="@{/admin/guias/listado}" th:text="#{accion.cancelar}">Cancelar</a>
                        <button class="btn btn-success" type="submit"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> <span th:text="#{accion.guardar}">Guardar</span></button>
                    </div>
                </form>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
