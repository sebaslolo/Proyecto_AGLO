<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{guia.meta.listado}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{guia.titulo}">Guías</h1>
                    <p th:text="#{guia.descripcionPagina}">Colaboradores disponibles para asignar a actividades.</p>
                </div>
                <a class="btn btn-light" th:href="@{/admin/guias/nuevo}">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i> <span th:text="#{guia.agregar}">Agregar guía</span>
                </a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead><tr><th th:text="#{guia.usuario}">Usuario</th><th th:text="#{guia.ingreso}">Ingreso</th><th th:text="#{guia.disponibilidad}">Disponibilidad</th><th th:text="#{guia.estado}">Estado</th><th></th></tr></thead>
                        <tbody>
                            <tr th:if="${guias == null or guias.empty}">
                                <td colspan="5" class="empty-row" th:text="#{guia.sinRegistros}">No hay guías registrados.</td>
                            </tr>
                            <tr th:each="guia : ${guias}">
                                <td th:text="${guia.usuario != null ? guia.usuario.nombre + ' ' + guia.usuario.apellidoPaterno : #messages.msg('general.sinUsuario')}">Guía</td>
                                <td th:text="${guia.fechaIngreso != null ? #temporals.format(guia.fechaIngreso, #messages.msg('formato.fechaCorta')) : #messages.msg('general.sinFecha')}">Fecha</td>
                                <td th:text="${guia.disponibilidad == null ? #messages.msg('general.sinDato') : (guia.disponibilidad ? #messages.msg('guia.disponible') : #messages.msg('guia.noDisponible'))}">Disponible</td>
                                <td th:text="${guia.estado != null ? guia.estado.nombreEstado : #messages.msg('general.sinEstado')}">Activo</td>
                                <td class="text-end">
                                    <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/guias/modificar/{id}(id=${guia.idGuia})}"><i class="fa-solid fa-pen" aria-hidden="true"></i> <span th:text="#{accion.editar}">Editar</span></a>
                                    <button class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-id="${guia.idGuia}"
                                            th:data-delete-action="@{/admin/guias/eliminar}"
                                            data-delete-field="idGuia"
                                            th:data-delete-name="${guia.usuario != null ? guia.usuario.nombre : #messages.msg('general.guia')}">
                                        <i class="fa-solid fa-trash" aria-hidden="true"></i> <span th:text="#{accion.eliminar}">Eliminar</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <th:block th:replace="~{admin/fragmentos :: delete-modal}"></th:block>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
