<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{tipoActividad.meta.formulario}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="${tipoActividad.idTipoActividad == null} ? #{tipoActividad.nuevo} : #{tipoActividad.editar}">Tipo de actividad</h1>
                    <p th:text="#{tipoActividad.descripcionFormulario}">Defina descripción, precio base, duración e imagen.</p>
                </div>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <form th:action="@{/admin/tipos-actividad/guardar}" th:object="${tipoActividad}" method="post" class="was-validated">
                    <input type="hidden" th:field="*{idTipoActividad}"/>
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger form-errors" role="alert">
                        <strong th:text="#{formulario.invalido}">Revise los datos indicados.</strong>
                        <ul class="mb-0 mt-2"><li th:each="fieldError : ${#fields.allErrors()}" th:text="${fieldError}">Error de validación</li></ul>
                    </div>
                    <div class="form-grid">
                        <div>
                            <label class="form-label" for="nombreTipoActividad" th:text="#{tipoActividad.nombreTipoActividad}">Nombre</label>
                            <input class="form-control" type="text" th:field="*{nombreTipoActividad}" maxlength="100" required/>
                        </div>
                        <div>
                            <label class="form-label" for="idEstado" th:text="#{tipoActividad.estado}">Estado</label>
                            <select class="form-select" id="idEstado" name="estado.idEstado" required>
                                <option value="" th:text="#{general.seleccione}">Seleccione</option>
                                <option th:each="estado : ${estados}" th:value="${estado.idEstado}" th:selected="${tipoActividad.estado != null and tipoActividad.estado.idEstado == estado.idEstado}" th:text="${estado.nombreEstado}">Activo</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="precioBase" th:text="#{tipoActividad.precioBase}">Precio base</label>
                            <input class="form-control" type="number" th:field="*{precioBase}" min="0" step="0.01" required/>
                        </div>
                        <div>
                            <label class="form-label" for="duracionEstimada" th:text="#{tipoActividad.duracionEstimada}">Duración estimada</label>
                            <input class="form-control" type="text" th:field="*{duracionEstimada}" maxlength="50" required/>
                        </div>
                        <div class="full-row">
                            <label class="form-label" for="descripcionTipoActividad" th:text="#{tipoActividad.descripcionTipoActividad}">Descripción</label>
                            <textarea class="form-control" th:field="*{descripcionTipoActividad}" maxlength="255" required></textarea>
                        </div>
                        <div class="full-row">
                            <label class="form-label" for="imagenTipoActividad" th:text="#{tipoActividad.imagenTipoActividad}">Imagen</label>
                            <input class="form-control" type="text" th:field="*{imagenTipoActividad}" maxlength="500" th:placeholder="#{tipoActividad.imagenPlaceholder}"/>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="btn btn-outline-dark" th:href="@{/admin/tipos-actividad/listado}" th:text="#{accion.cancelar}">Cancelar</a>
                        <button class="btn btn-success" type="submit" th:text="#{accion.guardar}">Guardar</button>
                    </div>
                </form>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
