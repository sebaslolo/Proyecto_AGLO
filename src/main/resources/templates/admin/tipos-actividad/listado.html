<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{tipoActividad.meta.listado}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{tipoActividad.titulo}">Tipos de actividad</h1>
                    <p th:text="#{tipoActividad.descripcionPagina}">Catálogo base para crear actividades turísticas.</p>
                </div>
                <a class="btn btn-light" th:href="@{/admin/tipos-actividad/nuevo}" th:text="#{accion.nuevo}">Nuevo</a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead><tr><th th:text="#{tipoActividad.nombreTipoActividad}">Nombre</th><th th:text="#{tipoActividad.precio}">Precio</th><th th:text="#{tipoActividad.duracion}">Duración</th><th th:text="#{tipoActividad.estado}">Estado</th><th></th></tr></thead>
                        <tbody>
                            <tr th:if="${tiposActividad == null or tiposActividad.empty}">
                                <td colspan="5" class="empty-row" th:text="#{tipoActividad.sinRegistros}">No hay tipos de actividad registrados.</td>
                            </tr>
                            <tr th:each="tipo : ${tiposActividad}">
                                <td>
                                    <strong th:text="${tipo.nombreTipoActividad}">Tour</strong>
                                    <small class="d-block" th:text="${tipo.descripcionTipoActividad != null and !tipo.descripcionTipoActividad.isBlank() ? tipo.descripcionTipoActividad : #messages.msg('general.sinDescripcion')}">Descripción</small>
                                </td>
                                <td th:text="${tipo.precioBase != null ? @monedaCostaRica.formatear(tipo.precioBase) : #messages.msg('tipoActividad.sinPrecio')}">₡0</td>
                                <td th:text="${tipo.duracionEstimada != null and !tipo.duracionEstimada.isBlank() ? tipo.duracionEstimada : #messages.msg('general.sinDato')}">2 horas</td>
                                <td th:text="${tipo.estado != null ? tipo.estado.nombreEstado : #messages.msg('general.sinEstado')}">Activo</td>
                                <td class="text-end">
                                    <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/tipos-actividad/modificar/{id}(id=${tipo.idTipoActividad})}" th:text="#{accion.editar}">Editar</a>
                                    <button class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/tipos-actividad/eliminar}"
                                            data-delete-field="idTipoActividad"
                                            th:data-delete-id="${tipo.idTipoActividad}"
                                            th:data-delete-name="${tipo.nombreTipoActividad}"
                                            th:text="#{accion.eliminar}">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <th:block th:replace="~{admin/fragmentos :: delete-modal}"></th:block>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
