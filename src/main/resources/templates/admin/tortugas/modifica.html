<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head('Tortuga | AGLO', 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="${tortuga.etiquetaTortuga == null ? 'Nueva tortuga' : 'Editar tortuga'}">Tortuga</h1>
                    <p>Registre la identificación y características de la tortuga.</p>
                </div>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>

            <section class="admin-panel">
                <form th:action="@{/admin/tortugas/guardar}" th:object="${tortuga}" method="post" class="was-validated">
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger form-errors" role="alert">
                        <strong>Revise los datos indicados.</strong>
                        <ul class="mb-0 mt-2"><li th:each="fieldError : ${#fields.allErrors()}" th:text="${fieldError}">Error de validación</li></ul>
                    </div>
                    <div class="form-grid">
                        <div>
                            <label class="form-label" for="etiquetaTortuga">Etiqueta</label>
                            <input class="form-control" type="text" th:field="*{etiquetaTortuga}" maxlength="50" required
                                   th:readonly="${tortuga.etiquetaTortuga != null}"/>
                            <div class="form-text" th:if="${tortuga.etiquetaTortuga != null}">La etiqueta es el identificador del registro y no se puede cambiar.</div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('etiquetaTortuga')}" th:errors="*{etiquetaTortuga}">Dato requerido</div>
                        </div>
                        <div>
                            <label class="form-label" for="idEstado">Estado</label>
                            <select class="form-select" id="idEstado" name="estado.idEstado" required>
                                <option value="">Seleccione</option>
                                <option th:each="estadoItem : ${estados}"
                                        th:value="${estadoItem.idEstado}"
                                        th:selected="${tortuga.estado != null and tortuga.estado.idEstado == estadoItem.idEstado}"
                                        th:text="${estadoItem.nombreEstado}">Activo</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="especie">Especie</label>
                            <input class="form-control" type="text" th:field="*{especie}" maxlength="100" required/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}">Dato requerido</div>
                        </div>
                        <div>
                            <label class="form-label" for="sexo">Sexo</label>
                            <input class="form-control" type="text" th:field="*{sexo}" maxlength="10" required/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('sexo')}" th:errors="*{sexo}">Dato requerido</div>
                        </div>
                        <div>
                            <label class="form-label" for="fechaRegistro">Fecha de registro</label>
                            <input class="form-control" type="datetime-local" id="fechaRegistro" name="fechaRegistro"
                                   th:value="${tortuga.fechaRegistro != null ? #temporals.format(tortuga.fechaRegistro, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
                        </div>
                        <div class="full-row">
                            <label class="form-label" for="observaciones">Observaciones</label>
                            <textarea class="form-control" th:field="*{observaciones}" rows="4" maxlength="255"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="btn btn-outline-dark" th:href="@{/admin/tortugas/listado}">Cancelar</a>
                        <button class="btn btn-success" type="submit"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                    </div>
                </form>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
