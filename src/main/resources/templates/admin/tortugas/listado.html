<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head('Tortugas | AGLO', 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1>Tortugas</h1>
                    <p>Catálogo e identificación de tortugas monitoreadas.</p>
                </div>
                <a class="btn page-action" th:href="@{/admin/tortugas/nuevo}">
                    <i class="fa-solid fa-plus"></i> Nueva tortuga
                </a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>

            <section class="admin-panel">
                <p class="admin-summary" th:text="${totalTortugas} + ' tortuga(s) registrada(s)'">0 tortugas registradas</p>
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th>Etiqueta</th>
                                <th>Especie</th>
                                <th>Sexo</th>
                                <th>Registro</th>
                                <th>Estado</th>
                                <th class="actions-header">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${tortugas == null or tortugas.empty}">
                                <td colspan="6" class="empty-row">No hay tortugas registradas.</td>
                            </tr>
                            <tr th:each="tortuga : ${tortugas}">
                                <td th:text="${tortuga.etiquetaTortuga}">T-001</td>
                                <td th:text="${tortuga.especie}">Lepidochelys olivacea</td>
                                <td th:text="${tortuga.sexo}">Hembra</td>
                                <td th:text="${tortuga.fechaRegistro != null ? #temporals.format(tortuga.fechaRegistro, 'dd/MM/yyyy HH:mm') : 'Sin fecha'}">14/08/2026</td>
                                <td th:text="${tortuga.estado != null ? tortuga.estado.nombreEstado : 'Sin estado'}">Activo</td>
                                <td class="table-actions">
                                    <a class="btn btn-sm btn-outline-dark"
                                       th:href="@{/admin/tortugas/modificar/{etiqueta}(etiqueta=${tortuga.etiquetaTortuga})}">
                                        <i class="fa-solid fa-pen"></i> Editar
                                    </a>
                                    <button th:if="${isAdmin}" class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/tortugas/eliminar}"
                                            data-delete-field="etiquetaTortuga"
                                            th:data-delete-id="${tortuga.etiquetaTortuga}"
                                            th:data-delete-name="${tortuga.etiquetaTortuga}">
                                        <i class="fa-solid fa-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <div th:replace="~{admin/fragmentos :: delete-modal}"></div>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
