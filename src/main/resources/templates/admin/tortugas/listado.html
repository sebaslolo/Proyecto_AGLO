<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{tortuga.meta.listado}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{tortuga.titulo}">Tortugas</h1>
                    <p th:text="#{tortuga.descripcionPagina}">Catálogo e identificación de tortugas monitoreadas.</p>
                </div>
                <a class="btn page-action" th:href="@{/admin/tortugas/nuevo}">
                    <i class="fa-solid fa-plus"></i>
                    <span th:text="#{tortuga.nueva}">Nueva tortuga</span>
                </a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <p class="admin-summary" th:text="#{tortuga.resumen(${totalTortugas})}">Tortugas registradas: 0</p>
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th th:text="#{tortuga.etiqueta}">Etiqueta</th>
                                <th th:text="#{tortuga.especie}">Especie</th>
                                <th th:text="#{tortuga.sexo}">Sexo</th>
                                <th th:text="#{tortuga.registro}">Registro</th>
                                <th th:text="#{tortuga.estado}">Estado</th>
                                <th class="actions-header" th:text="#{general.acciones}">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${tortugas == null or tortugas.empty}">
                                <td colspan="6" class="empty-row" th:text="#{tortuga.sinRegistros}">No hay tortugas registradas.</td>
                            </tr>
                            <tr th:each="tortuga : ${tortugas}">
                                <td th:text="${tortuga.etiquetaTortuga}">T-001</td>
                                <td th:text="${tortuga.especie != null and !tortuga.especie.isBlank()} ? ${tortuga.especie} : #{general.sinDato}">Lepidochelys olivacea</td>
                                <td th:text="${tortuga.sexo != null and !tortuga.sexo.isBlank()} ? ${tortuga.sexo} : #{general.sinDato}">Hembra</td>
                                <td th:text="${tortuga.fechaRegistro != null} ? ${#temporals.format(tortuga.fechaRegistro, 'dd/MM/yyyy HH:mm')} : #{general.sinFecha}">14/08/2026</td>
                                <td th:text="${tortuga.estado != null} ? ${tortuga.estado.nombreEstado} : #{general.sinEstado}">Activo</td>
                                <td class="table-actions">
                                    <a class="btn btn-sm btn-outline-dark"
                                       th:href="@{/admin/tortugas/modificar/{etiqueta}(etiqueta=${tortuga.etiquetaTortuga})}">
                                        <i class="fa-solid fa-pen"></i>
                                        <span th:text="#{accion.editar}">Editar</span>
                                    </a>
                                    <button th:if="${isAdmin}" class="btn btn-sm btn-outline-danger" type="button"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                                            th:data-delete-action="@{/admin/tortugas/eliminar}"
                                            data-delete-field="etiquetaTortuga"
                                            th:data-delete-id="${tortuga.etiquetaTortuga}"
                                            th:data-delete-name="${tortuga.etiquetaTortuga}">
                                        <i class="fa-solid fa-trash"></i>
                                        <span th:text="#{accion.eliminar}">Eliminar</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <div th:replace="~{admin/fragmentos :: delete-modal}"></div>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
