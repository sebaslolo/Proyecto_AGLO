<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{guia.agenda.meta}, 'admin.css')}"></head>
    <body class="admin-page">
        <header th:replace="~{admin/fragmentos :: nav}"></header>
        <main class="admin-main">
            <section class="admin-page-title">
                <div>
                    <h1 th:text="#{guia.agenda}">Agenda del guía</h1>
                    <p th:text="#{guia.agenda.descripcion}">Actividades turísticas asignadas.</p>
                </div>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="admin-panel">
                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th th:text="#{guia.agenda.actividad}">Actividad</th>
                                <th th:text="#{guia.agenda.inicio}">Inicio</th>
                                <th th:text="#{guia.agenda.fin}">Fin</th>
                                <th th:text="#{guia.agenda.tipo}">Tipo</th>
                                <th th:text="#{general.estado}">Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${asignaciones == null or asignaciones.empty}">
                                <td colspan="5" class="empty-row" th:text="#{guia.agenda.sinActividades}">No hay actividades asignadas.</td>
                            </tr>
                            <tr th:each="asignacion : ${asignaciones}">
                                <td th:text="${asignacion.actividad != null ? asignacion.actividad.nombreActividad : #messages.msg('guia.agenda.sinActividad')}">Actividad</td>
                                <td th:text="${asignacion.actividad != null and asignacion.actividad.fechaHoraInicio != null ? #temporals.format(asignacion.actividad.fechaHoraInicio, #messages.msg('formato.fechaHoraCorta')) : #messages.msg('general.sinFecha')}">Inicio</td>
                                <td th:text="${asignacion.actividad != null and asignacion.actividad.fechaHoraFin != null ? #temporals.format(asignacion.actividad.fechaHoraFin, #messages.msg('formato.fechaHoraCorta')) : #messages.msg('general.sinFecha')}">Fin</td>
                                <td th:text="${asignacion.actividad != null and asignacion.actividad.tipoActividad != null ? asignacion.actividad.tipoActividad.nombreTipoActividad : #messages.msg('guia.agenda.sinTipo')}">Tipo</td>
                                <td th:text="${asignacion.estado != null ? asignacion.estado.nombreEstado : #messages.msg('general.sinEstado')}">Activo</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
