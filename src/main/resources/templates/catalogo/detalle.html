<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{catalogo.meta.detalle}, 'dashboard.css')}"></head>
    <body class="public-page">
        <main class="public-main">
            <section class="public-page-title">
                <div>
                    <h1 th:text="${actividad.nombreActividad}">Actividad</h1>
                    <p th:text="${actividad.tipoActividad != null ? actividad.tipoActividad.nombreTipoActividad : #messages.msg('catalogo.actividadTuristica')}">Tipo</p>
                </div>
                <a class="btn btn-light" th:href="@{/catalogo/listado}" th:text="#{accion.regresar}">Regresar</a>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="detail-layout">
                <article class="detail-panel">
                    <img class="detail-image"
                         th:src="${actividad.imagenActividad != null and !actividad.imagenActividad.isEmpty() ? actividad.imagenActividad : (actividad.tipoActividad != null and actividad.tipoActividad.imagenTipoActividad != null and !actividad.tipoActividad.imagenTipoActividad.isEmpty() ? actividad.tipoActividad.imagenTipoActividad : 'https://vivemar.com.mx/wp-content/uploads/2022/01/Vivemar_Liberacion-%E2%80%93-monitoreo-nocturno-new-3.jpg')}"
                         th:alt="${actividad.nombreActividad}"/>
                    <div class="detail-body">
                        <h2 th:text="${actividad.nombreActividad}">Actividad</h2>
                        <p th:text="${actividad.tipoActividad != null and actividad.tipoActividad.descripcionTipoActividad != null and !actividad.tipoActividad.descripcionTipoActividad.isBlank() ? actividad.tipoActividad.descripcionTipoActividad : #messages.msg('catalogo.actividadTuristicaOstional')}">Descripción</p>
                    </div>
                </article>
                <aside class="admin-panel">
                    <div class="catalog-meta">
                        <span><strong th:text="#{catalogo.inicio}">Inicio:</strong> <span th:text="${actividad.fechaHoraInicio != null ? #temporals.format(actividad.fechaHoraInicio, #messages.msg('formato.fechaHoraCorta')) : #messages.msg('catalogo.fechaConfirmar')}">Fecha</span></span>
                        <span><strong th:text="#{catalogo.fin}">Fin:</strong> <span th:text="${actividad.fechaHoraFin != null ? #temporals.format(actividad.fechaHoraFin, #messages.msg('formato.fechaHoraCorta')) : #messages.msg('catalogo.fechaConfirmar')}">Fecha</span></span>
                        <span><strong th:text="#{catalogo.precio}">Precio:</strong> <span th:text="${actividad.precioActual != null ? @monedaCostaRica.formatear(actividad.precioActual) : #messages.msg('catalogo.precioConfirmar')}">Precio</span></span>
                        <span><strong th:text="#{catalogo.cupoDisponible}">Cupo disponible:</strong> <span th:text="${cupoDisponible}">0</span></span>
                    </div>
                    <h3 class="mt-4" th:text="#{catalogo.guiasAsignados}">Guías asignados</h3>
                    <ul class="list-unstyled">
                        <li th:if="${guias == null or guias.empty}" th:text="#{catalogo.sinGuias}">Sin guías asignados.</li>
                        <li th:each="asignacion : ${guias}"
                            th:text="${asignacion.guia != null and asignacion.guia.usuario != null ? asignacion.guia.usuario.nombre + ' ' + asignacion.guia.usuario.apellidoPaterno : #messages.msg('catalogo.guiaLocal')}">Guía</li>
                    </ul>
                    <a class="btn btn-success w-100"
                       th:if="${cupoDisponible > 0}"
                       th:href="@{/reservaciones/nueva(idActividad=${actividad.idActividad})}"
                       th:text="#{accion.reservar}">Reservar</a>
                    <button class="btn btn-secondary w-100" th:if="${cupoDisponible <= 0}" type="button" disabled th:text="#{catalogo.actividadLlena}">Actividad llena</button>
                </aside>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
