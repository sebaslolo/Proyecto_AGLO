<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{catalogo.meta.listado}, 'dashboard.css')}"></head>
    <body class="public-page">
        <main class="public-main">
            <section class="public-page-title">
                <div>
                    <h1 th:text="#{catalogo.titulo}">Catálogo de actividades turísticas</h1>
                    <p th:text="#{catalogo.descripcionPagina}">Actividades disponibles para visitar Playa Ostional.</p>
                </div>
                <div class="d-flex gap-2">
                    <a class="btn btn-light" th:href="@{/inicio}" th:text="#{menu.inicio}">Inicio</a>
                    <a class="btn btn-outline-light" th:href="@{/mis-reservaciones}" th:text="#{reservacion.historial}">Mis reservaciones</a>
                </div>
            </section>
            <section th:replace="~{admin/fragmentos :: mensajes}"></section>
            <section class="catalog-grid">
                <article class="catalog-card" th:if="${actividades == null or actividades.empty}">
                    <div class="catalog-card-body">
                        <h2 th:text="#{catalogo.sinActividades.titulo}">No hay actividades disponibles</h2>
                        <p th:text="#{catalogo.sinActividades.descripcion}">Pronto publicaremos nuevas actividades.</p>
                    </div>
                </article>
                <article class="catalog-card" th:each="actividad : ${actividades}">
                    <img th:src="${actividad.imagenActividad != null and !actividad.imagenActividad.isEmpty() ? actividad.imagenActividad : (actividad.tipoActividad != null and actividad.tipoActividad.imagenTipoActividad != null and !actividad.tipoActividad.imagenTipoActividad.isEmpty() ? actividad.tipoActividad.imagenTipoActividad : 'https://vivemar.com.mx/wp-content/uploads/2022/01/Vivemar_Liberacion-%E2%80%93-monitoreo-nocturno-new-3.jpg')}"
                         th:alt="${actividad.nombreActividad}"/>
                    <div class="catalog-card-body">
                        <h2 th:text="${actividad.nombreActividad}">Actividad</h2>
                        <div class="catalog-meta">
                            <span th:text="${actividad.tipoActividad != null ? actividad.tipoActividad.nombreTipoActividad : #messages.msg('catalogo.actividadTuristica')}">Tipo</span>
                            <span th:text="${actividad.fechaHoraInicio != null ? #temporals.format(actividad.fechaHoraInicio, #messages.msg('formato.fechaHoraCorta')) : #messages.msg('catalogo.fechaConfirmar')}">Fecha</span>
                            <span th:text="${actividad.precioActual != null ? @monedaCostaRica.formatear(actividad.precioActual) : #messages.msg('catalogo.precioConfirmar')}">Precio</span>
                            <span th:text="${cuposDisponibles[actividad.idActividad] != null and cuposDisponibles[actividad.idActividad] > 0 ? #messages.msg('catalogo.cupoDisponibleCantidad', cuposDisponibles[actividad.idActividad]) : #messages.msg('catalogo.sinDisponibilidad')}">Cupo</span>
                        </div>
                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-dark btn-sm" th:href="@{/catalogo/detalle/{id}(id=${actividad.idActividad})}" th:text="#{accion.detalle}">Detalle</a>
                            <a class="btn btn-success btn-sm"
                               th:if="${cuposDisponibles[actividad.idActividad] != null and cuposDisponibles[actividad.idActividad] > 0}"
                               th:href="@{/reservaciones/nueva(idActividad=${actividad.idActividad})}"
                               th:text="#{accion.reservar}">Reservar</a>
                            <button class="btn btn-secondary btn-sm" th:if="${cuposDisponibles[actividad.idActividad] == null or cuposDisponibles[actividad.idActividad] <= 0}" type="button" disabled th:text="#{catalogo.actividadLlena}">Actividad llena</button>
                        </div>
                    </div>
                </article>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
