<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{auth.registro.meta}, 'registro.css')}"></head>

    <body>
        <section class="fondo">
            <div class="overlay"></div>

            <header class="navbar">
                <div class="logo">
                    <img th:src="@{/img/logoAglo.png}" src="/img/logoAglo.png" alt="Logo AGLO"/>
                    <h2>AGLO</h2>
                </div>
                <nav>
                    <a th:href="@{/login}" href="/login" class="btnLogin" th:text="#{accion.iniciarSesion}">Iniciar Sesión</a>
                    <a th:href="@{/registro}" href="/registro" class="btnRegistro" th:text="#{auth.registrarse}">Registrarse</a>
                </nav>
            </header>
            <main class="contenedor">
                <div class="cardRegistro">
                    <h1 th:text="#{auth.registro.titulo}">Crear cuenta</h1>
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>
                    <form id="formRegistro" th:action="@{/registro}" th:object="${registroForm}" action="/registro" method="post">
                        <div class="grupo">
                            <label for="username" th:text="#{usuario.username}">Usuario</label>
                            <input type="text" id="username" th:field="*{username}" maxlength="30" th:placeholder="#{auth.registro.usernamePlaceholder}"/>
                            <small id="errorUsername" th:text="${#fields.hasErrors('username')} ? #{auth.registro.error.username} : ''"></small>
                        </div>
                        <div class="grupo">
                            <label for="nombre" th:text="#{usuario.nombre}">Nombre</label>
                            <input type="text" id="nombre" th:field="*{nombre}" maxlength="20" th:placeholder="#{auth.registro.nombrePlaceholder}"/>
                            <small id="errorNombre" th:text="${#fields.hasErrors('nombre')} ? #{auth.registro.error.nombre} : ''"></small>
                        </div>
                        <div class="grupo">
                            <label for="apellidoPaterno" th:text="#{usuario.apellidoPaterno}">Apellido paterno</label>
                            <input type="text" id="apellidoPaterno" th:field="*{apellidoPaterno}" maxlength="30" th:placeholder="#{auth.registro.apellidoPaternoPlaceholder}"/>
                            <small id="errorApellidoPaterno" th:text="${#fields.hasErrors('apellidoPaterno')} ? #{auth.registro.error.apellidoPaterno} : ''"></small>
                        </div>
                        <div class="grupo">
                            <label for="apellidoMaterno" th:text="#{usuario.apellidoMaterno}">Apellido materno</label>
                            <input type="text" id="apellidoMaterno" th:field="*{apellidoMaterno}" maxlength="30" th:placeholder="#{auth.opcional}"/>
                            <small id="errorApellidoMaterno" th:text="${#fields.hasErrors('apellidoMaterno')} ? #{auth.registro.error.apellidoMaterno} : ''"></small>
                        </div>
                        <div class="grupo">
                            <label for="correo" th:text="#{usuario.correo}">Correo electrónico</label>
                            <input type="email" id="correo" th:field="*{correo}" maxlength="75" th:placeholder="#{auth.registro.correoPlaceholder}"/>
                            <small id="errorCorreo" th:text="${#fields.hasErrors('correo')} ? #{auth.registro.error.correo} : ''"></small>
                        </div>
                        <div class="grupo">
                            <label for="telefono" th:text="#{usuario.telefono}">Teléfono</label>
                            <input type="tel" id="telefono" th:field="*{telefono}" maxlength="25" th:placeholder="#{auth.opcional}"/>
                            <small id="errorTelefono" th:text="${#fields.hasErrors('telefono')} ? #{auth.registro.error.telefono} : ''"></small>
                        </div>
                        <div class="grupo">
                            <label for="password" th:text="#{usuario.password}">Contraseña</label>
                            <div class="inputPassword">
                                <input type="password" id="password" th:field="*{password}" placeholder="********"/>
                                <i class="fa-regular fa-eye-slash ojo" aria-hidden="true"></i>
                            </div>
                            <small id="errorPassword" th:text="${#fields.hasErrors('password')} ? #{auth.registro.error.password} : ''"></small>
                        </div>
                        <div class="grupo">
                            <label for="confirmar" th:text="#{auth.registro.confirmarPassword}">Confirmar contraseña</label>
                            <div class="inputPassword">
                                <input type="password" id="confirmar" th:field="*{confirmar}" placeholder="********"/>
                                <i class="fa-regular fa-eye-slash ojo" aria-hidden="true"></i>
                            </div>
                            <small id="errorConfirmar" th:text="${#fields.hasErrors('confirmar')} ? #{auth.registro.error.confirmar} : ''"></small>
                        </div>
                        <button type="submit" class="btnCrear" th:text="#{auth.registrarse}">Registrarse</button>

                        <p class="login">
                            <span th:text="#{auth.registro.yaCuenta}">¿Ya tienes cuenta?</span>
                            <a th:href="@{/login}" href="/login" th:text="#{auth.registro.iniciaSesion}">Inicia sesión</a>
                        </p>
                    </form>
                </div>
            </main>
            <a th:href="@{/inicio}" href="/inicio" class="flecha" th:attr="aria-label=#{auth.volverInicio}">
                <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
            </a>
        </section>

        <th:block th:replace="~{aglo/fragmentos :: scripts('registro.js')}"></th:block>
    </body>
</html>
