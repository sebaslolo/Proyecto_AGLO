<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{auth.recuperar.meta}, 'login.css')}"></head>

    <body>
        <section class="fondo">

            <div class="overlay"></div>

            <header class="navbar">
                <div class="logo">
                    <img th:src="@{/img/logoAglo.png}" alt="Logo AGLO"/>
                    <h2>AGLO</h2>
                </div>

                <nav>
                    <a th:href="@{/login}"
                       class="btnLogin"
                       th:text="#{accion.iniciarSesion}">
                        Iniciar Sesión
                    </a>

                    <a th:href="@{/registro}"
                       class="btnRegistro"
                       th:text="#{auth.registrarse}">
                        Registrarse
                    </a>
                </nav>
            </header>

            <main class="contenedor">

                <div class="cardRegistro">

                    <h1 th:text="#{auth.recuperar.titulo}">
                        Recuperar contraseña
                    </h1>

<p>
    Ingrese el correo electrónico registrado en su cuenta.
    Recibirá una nueva contraseña para iniciar sesión.
</p>

                    <div class="alert alert-danger"
                         th:if="${error != null}"
                         th:text="${error}">
                    </div>

                    <form th:action="@{/forgot-password}"
                          method="post">

                        <div class="mb-3">

                            <label for="correo">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   id="correo"
                                   name="correo"
                                   class="form-control"
                                   required
                                   autocomplete="email"/>

                        </div>

                        <button type="submit"
                                class="btnRegistro">
Enviar nueva contraseña
                        </button>

                    </form>

                    <p class="login">
                        <a th:href="@{/login}"
                           th:text="#{auth.recuperar.volverLogin}">
                            Volver al inicio de sesión
                        </a>
                    </p>

                </div>

            </main>
        </section>

        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
