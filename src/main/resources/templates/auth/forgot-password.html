<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{auth.recuperar.meta}, 'login.css')}"></head>
    <body>
        <section class="fondo">
            <div class="overlay"></div>
            <header class="navbar">
                <div class="logo">
                    <img th:src="@{/img/logoAglo.png}" alt="Logo AGLO"/>
                    <h2>AGLO</h2>
                </div>
                <nav>
                    <a th:href="@{/login}" class="btnLogin" th:text="#{accion.iniciarSesion}">Iniciar Sesión</a>
                    <a th:href="@{/registro}" class="btnRegistro" th:text="#{auth.registrarse}">Registrarse</a>
                </nav>
            </header>
            <main class="contenedor">
                <div class="cardRegistro">
                    <h1 th:text="#{auth.recuperar.titulo}">Recuperar contraseña</h1>
                    <p th:text="#{auth.recuperar.descripcion}">La recuperación automática todavía no está disponible. Contacte al administrador de AGLO para restablecer su acceso.</p>
                    <p class="login"><a th:href="@{/login}" th:text="#{auth.recuperar.volverLogin}">Volver al inicio de sesión</a></p>
                </div>
            </main>
        </section>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
