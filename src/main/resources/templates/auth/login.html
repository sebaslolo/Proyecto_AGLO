<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{auth.login.meta}, 'login.css')}"></head>

    <body>
        <section class="fondo">
            <div class="overlay"></div>
            <header class="navbar">
                <div class="logo">
                    <img th:src="@{/img/logoAglo.png}" src="/img/logoAglo.png" alt="Logo AGLO"/>
                    <h2>AGLO</h2>
                </div>
                <nav>
                    <a th:href="@{/login}" href="/login" class="btnLogin" th:text="#{accion.iniciarSesion}">Iniciar Sesión</a>
                    <a th:href="@{/registro}" href="/registro" class="btnRegistro" th:text="#{auth.registrarse}">Registrarse</a>
                </nav>
            </header>
            <main class="contenedor">
                <div class="cardRegistro">
                    <h1 th:text="#{auth.login.titulo}">Iniciar Sesión</h1>
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>
                    <div th:if="${todoOk}" class="alert alert-success" role="alert" th:text="${todoOk}">Mensaje</div>
                    <form id="formLogin" th:action="@{/login}" th:object="${loginForm}" action="/login" method="post">
                        <div class="grupo">
                            <label for="username" th:text="#{login.username}">Usuario</label>
                            <input
                                type="text"
                                id="username"
                                th:field="*{username}"
                                th:placeholder="#{auth.login.usuarioPlaceholder}"/>
                            <small id="errorUsername" th:text="${#fields.hasErrors('username')} ? #{error.login} : ''"></small>
                        </div>
                        <div class="grupo">
                            <label for="password" th:text="#{login.password}">Contraseña</label>
                            <div class="inputPassword">
                                <input
                                type="password"
                                id="password"
                                th:field="*{password}"
                                placeholder="********"/>
                                <i class="fa-regular fa-eye-slash ojo" aria-hidden="true"></i>
                            </div>
                            <small id="errorPassword" th:text="${#fields.hasErrors('password')} ? #{error.login} : ''"></small>
                        </div>
                        <button type="submit" class="btnCrear" th:text="#{accion.iniciarSesion}">Iniciar Sesión</button>

                        <p class="login">
                            <a th:href="@{/forgot-password}" href="/forgot-password" th:text="#{login.olvido}">¿Olvidaste tu contraseña?</a>
                        </p>
                        <p class="login">
                            <span th:text="#{auth.login.sinCuenta}">¿No tienes cuenta?</span>
                            <a th:href="@{/registro}" href="/registro" th:text="#{auth.login.registrate}">Regístrate</a>
                        </p>
                    </form>
                </div>
            </main>

            <a th:href="@{/inicio}" href="/inicio" class="flecha" th:attr="aria-label=#{auth.volverInicio}">
                <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
            </a>
        </section>
        <th:block th:replace="~{aglo/fragmentos :: scripts('login.js')}"></th:block>
    </body>
</html>
