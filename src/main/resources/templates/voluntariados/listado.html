<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{aglo/fragmentos :: head(#{voluntariado.publico.meta}, 'dashboard.css')}"></head>
    <body class="public-page">
        <main class="public-main">
            <section class="public-page-title">
                <div>
                    <h1 th:text="#{voluntariado.titulo}">Voluntariados</h1>
                    <p th:text="#{voluntariado.publico.descripcion}">Oportunidades de apoyo comunitario y conservación.</p>
                </div>
                <a class="btn btn-light" th:href="@{/inicio}" th:text="#{menu.inicio}">Inicio</a>
            </section>
            <section class="admin-panel">
                <p class="mb-0" th:text="#{voluntariado.publico.moduloReservado}">Este módulo está reservado para publicar y administrar jornadas de voluntariado.</p>
            </section>
        </main>
        <th:block th:replace="~{aglo/fragmentos :: scripts('dashboard.js')}"></th:block>
    </body>
</html>
